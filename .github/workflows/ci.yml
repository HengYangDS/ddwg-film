name: Repository verification
"on":
  push:
    branches:
      - dev
      - main
      - proposal/**
    tags:
      - v*
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          version: 2026.10.23
          install: false
          cache: false
      - name: Acquire locked product supply
        run: mise install --locked --jobs=1
      - name: Check locked supply
        run: mise run bootstrap
      - name: Prepare owned evidence directory
        shell: bash
        run: mkdir -p build/evidence/ci
      - name: Execute installed verification
        run: mise exec --locked -- ethos prove --host --execute --full --json > build/evidence/ci/verification.json
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: build/evidence/ci/verification.json
          if-no-files-found: error
