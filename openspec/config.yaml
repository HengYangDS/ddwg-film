schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal:
    - Follow the official proposal template. State why the change is needed, what changes, the
      affected capabilities and the impact; mark breaking changes and name the out-of-scope boundary
      without copying implementation or execution history.
  specs:
    - Use the native delta operations ADDED, MODIFIED, REMOVED and RENAMED at exact capability
      paths. A MODIFIED requirement restates its complete block with every retained scenario; main
      specs keep only Purpose and Requirements.
    - State each requirement as an observable SHALL or MUST obligation with at least one Scenario
      whose WHEN and THEN clauses can falsify it; describe behavior and its boundaries, not
      implementation names.
  design:
    - Follow the official design template for a non-trivial change. Explain its architecture,
      alternatives, rationale, authority boundaries and migration risks, give each behavior one
      semantic owner, and reference the proposal and specs instead of restating them.
    - Keep execution history, logs and acceptance reports with their Git, CI and native evidence
      owners, not in design prose.
  tasks:
    - Use official checkboxes under numbered groups in dependency order, with numbering and nesting
      expressing one hierarchy. Each task keeps a stable identity, states one bounded action with
      its observable completion condition, and carries a truthful state.
    - Keep only short evidence references or current dependencies in tasks. Preserve execution
      history, logs and originals with their Git, CI and native evidence owners, never in tasks,
      design prose or a parallel ledger.
    - Separate implementation tasks from lifecycle preconditions and effects; a Change never records
      its own landing, archive or Lane retirement as a completed task.
