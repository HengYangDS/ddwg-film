schema_version = 1
id = "ddwg-film-gate-registry"
source_refs = ["system/gates.toml"]

[proof_sets]
default = ["native-static", "native-behavior", "film-media", "source-integrity"]
full = ["native-static", "native-behavior", "film-media", "source-integrity"]

[[gates]]
id = "native-static"
kind = "lint"
providers = ["ethos.adapters.gates.code_quality:static_report"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["python-code", "javascript-code"]
dimensions = ["static-analysis"]
execution_mode = "provider"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "native-behavior"
kind = "test"
providers = ["ethos.adapters.gates.code_quality:behavior_report"]
policy = "required"
profile = "repository"
toolchain = "ethos"
asset_classes = ["python-code", "javascript-code"]
dimensions = ["behavior", "coverage"]
execution_mode = "provider"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"

[[gates]]
id = "film-media"
kind = "asset"
command = [
  "uv",
  "run",
  "--python",
  "3.12",
  "--frozen",
  "--offline",
  "python",
  "-m",
  "ddwg_film.delivery.verification",
  "--read-only",
  "--language",
  "all",
  "build/artifacts/film/zh/ddwg-zh-uhd.mp4",
  "build/artifacts/film/zh/ddwg-zh-1080p-captioned.mp4",
  "build/artifacts/film/en/ddwg-en-uhd.mp4",
  "build/artifacts/film/en/ddwg-en-1080p-captioned.mp4",
]
policy = "required"
profile = "repository"
toolchain = "uv-python"
asset_classes = ["release-artifacts", "evidence"]
dimensions = [
  "duration",
  "frames",
  "sound",
  "subtitles",
  "source-integrity",
  "picture-geometry",
  "review-thresholds",
]
execution_mode = "adapter"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "verify-ddwg-film"
writes_files = false
network_policy = "offline"
version_source = "locked-toolchain"

[[gates]]
id = "source-integrity"
kind = "integrity"
providers = ["ethos.adapters.gates.provenance.observation:integrity_report"]
policy = "required"
profile = "repository"
toolchain = "ethos"
dimensions = ["source-integrity"]
execution_mode = "provider"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
writes_files = false
network_policy = "offline"
version_source = "product"
