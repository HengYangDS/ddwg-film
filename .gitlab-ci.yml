workflow:
  rules:
    - if: $ETHOS_OFFLINE_CANDIDATE && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main") && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - if: $ETHOS_OFFLINE_CANDIDATE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^proposal\// && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^proposal\// || $CI_COMMIT_TAG =~ /^v[^\/]*$/
stages:
  - verify
verify:macos:review:
  before_script:
    - mise install --locked --jobs=1
    - mise run bootstrap
    - mkdir -p build/evidence/ci
  rules:
    - if: $ETHOS_OFFLINE_CANDIDATE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push")
  stage: verify
  tags:
    - ci-macos-arm64-review
  timeout: 45 minutes
  interruptible: true
  variables:
    GIT_DEPTH: "0"
    MISE_CONFIG_DIR: $CI_PROJECT_DIR/build/runtime/work/mise-config
    MISE_CEILING_PATHS: $CI_PROJECT_DIR/..
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR/.config/mise/config.toml
    MISE_YES: "1"
  script:
    - mise exec --locked -- ethos prove --host --execute --full --json > build/evidence/ci/verification.json
  artifacts:
    when: always
    paths:
      - build/evidence/ci/verification.json
verify:macos:protected:
  before_script:
    - mise install --locked --jobs=1
    - mise run bootstrap
    - mkdir -p build/evidence/ci
  rules:
    - if: $ETHOS_OFFLINE_CANDIDATE
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[^\/]*$/)
  stage: verify
  tags:
    - ci-macos-arm64-shell
  timeout: 45 minutes
  interruptible: true
  variables:
    GIT_DEPTH: "0"
    MISE_CONFIG_DIR: $CI_PROJECT_DIR/build/runtime/work/mise-config
    MISE_CEILING_PATHS: $CI_PROJECT_DIR/..
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR/.config/mise/config.toml
    MISE_YES: "1"
  script:
    - mise exec --locked -- ethos prove --host --execute --full --json > build/evidence/ci/verification.json
  artifacts:
    when: always
    paths:
      - build/evidence/ci/verification.json
