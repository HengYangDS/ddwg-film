min_version = "2026.10.14"

[settings]
locked = true

# The repository's common verbs; the npm scripts and the frozen uv environment they call own the commands.
[tasks.bootstrap]
description = "Prepare the frozen Python environment and the locked npm packages"
run = ["uv sync --python 3.12 --frozen --group dev", "npm ci --include=dev"]
depends_post = ["check:dependencies"]

[tasks."check:dependencies"]
description = "Verify that the lock is current and the installed dependency graphs match the frozen inputs"
run = [
  "uv lock --python 3.12 --check --offline",
  "uv sync --python 3.12 --frozen --check --offline --group dev",
  "uv run --python 3.12 --frozen --offline --no-sync --group dev uv pip check",
  "npm ls --all --include=dev",
]

[tasks.check]
description = "Run the picture and Python tests and check the Markdown formatting without writing"
depends = ["check:dependencies"]
run = [
  "npm test",
  "npm run format:markdown:check",
  "uv run --python 3.12 --frozen --offline --group dev python -m pytest -q tests",
]

[tasks.fix]
description = "Apply the Markdown formatter to the files it owns"
run = "npm run format:markdown"

# The ETHOS gates resolve these only from this lock, never from PATH: Node for the picture checks,
# Python and uv for the suite. Python stays on the 3.12 line that production selects.
[tools]
node = "26.12.1"
python = "3.12.16"
uv = "0.13.5"

# The ETHOS release declaration as published with v0.2.0-alpha.19.
[tools."http:ethos"]
version = "0.2.0-alpha.19"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-linux-arm64.tar.gz", checksum = "sha256:277a887e40801a1fd35e92659b48919ef4620b45f34c53404311e0b1040bcc63", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-linux-x64.tar.gz", checksum = "sha256:b3dd983214084216b8094f439801e59618fd31a355bdaf1ffba4772edfdb201f", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-macos-arm64.tar.gz", checksum = "sha256:5a0f745f327a4af890b0c62f5cba3985fb4faf67ab03a6ba6d6313922d9d4130", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-alpha.19/ethos-0.2.0-alpha.19-windows-x64.tar.gz", checksum = "sha256:015d29b34d87ec3eb5946a4ce293aa0b9df7ea8d83fd9f42e1b50c5023be8661", bin_path = "ethos/bin" }
